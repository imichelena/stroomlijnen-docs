<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img"><title>Security is a system, not a single connection.</title><desc>Three responsibilities. Explicit boundaries. Different treatment for custom DC and OEM AC chargers.</desc><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#00779b"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#00745f"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#8b5300"/></marker></defs><rect width="1400" height="1060" fill="#f7fafc"/><text x="56" y="48" fill="#00779b" font-family="Arial, sans-serif" font-size="16" font-weight="700">STROOMLIJNEN  /  SECURE ENERGY INFRASTRUCTURE</text><text x="56" y="104" fill="#0c2340" font-family="Arial, sans-serif" font-size="40" font-weight="700">Security is a system, not a single connection.</text><text x="56" y="145" fill="#405a70" font-family="Arial, sans-serif" font-size="20" font-weight="400">Three responsibilities. Explicit boundaries. Different treatment for custom DC and OEM AC chargers.</text><rect x="56" y="200" width="365" height="255" rx="18" fill="#ffffff" stroke="#00779b" stroke-width="1.5"/><text x="80" y="240" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">01  CLOUD</text><text x="80" y="278" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Platform API</text><text x="80" y="307" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Site-level integration</text><text x="80" y="336" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Receives bastion-originated</text><text x="80" y="365" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">API traffic — not charger OCPP.</text><rect x="518" y="200" width="365" height="255" rx="18" fill="#ffffff" stroke="#00745f" stroke-width="1.5"/><text x="542" y="240" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">02  SITE BASTION</text><text x="542" y="278" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Site security boundary</text><text x="542" y="307" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">API mediation for custom DC</text><text x="542" y="336" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Local OCPP termination for AC</text><text x="542" y="365" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Connects outward to the cloud.</text><rect x="980" y="200" width="365" height="255" rx="18" fill="#ffffff" stroke="#00779b" stroke-width="1.5"/><text x="1004" y="240" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">03  CUSTOM APK</text><text x="1004" y="278" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Own DC charger software</text><text x="1004" y="307" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Direct API — not OCPP</text><text x="1004" y="336" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Client identity on its connection</text><text x="1004" y="365" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">to the bastion direct endpoint.</text><path d="M518,327 L426,327" fill="none" stroke="#00745f" stroke-width="3" marker-end="url(#green)"/><text x="437" y="300" fill="#00745f" font-family="Arial, sans-serif" font-size="17" font-weight="700">API</text><path d="M980,327 L888,327" fill="none" stroke="#00779b" stroke-width="3" marker-end="url(#blue)"/><text x="895" y="300" fill="#00779b" font-family="Arial, sans-serif" font-size="17" font-weight="700">mTLS</text><text x="56" y="505" fill="#00779b" font-family="Arial, sans-serif" font-size="17" font-weight="700">TWO TRUST BOUNDARIES — NOT ONE “SECURE NETWORK”</text><rect x="56" y="540" width="620" height="165" rx="18" fill="#ffffff" stroke="#00745f" stroke-width="1.5"/><text x="80" y="580" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Network boundary</text><text x="80" y="618" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">WireGuard protects the cloud–site transport.</text><text x="80" y="647" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">The bastion mediates the site connection; the overlay</text><text x="80" y="676" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">does not replace application identity or authorization.</text><rect x="704" y="540" width="641" height="165" rx="18" fill="#ffffff" stroke="#00779b" stroke-width="1.5"/><text x="728" y="580" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Application boundary</text><text x="728" y="618" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">The custom APK presents a client certificate to the</text><text x="728" y="647" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">bastion direct API. Do not extend this assurance to</text><text x="728" y="676" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">every local protocol or to the entire OEM fleet.</text><rect x="56" y="748" width="1289" height="162" rx="18" fill="#ffffff" stroke="#8b5300" stroke-width="1.5"/><text x="80" y="788" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">OEM AC is a separate security case</text><text x="80" y="826" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">OEM AC chargers use local OCPP, terminated at the bastion. Client certificates are not a fleet-wide assumption.</text><text x="80" y="855" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Local containment matters: legacy plaintext links must not be described as end-to-end encrypted.</text><text x="80" y="884" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">The platform-facing interface remains API-based; the cloud does not terminate charger OCPP.</text><text x="56" y="992" fill="#8b5300" font-family="Arial, sans-serif" font-size="17" font-weight="700">DOCUMENTED ARCHITECTURE · Verify the configuration of each deployed site</text><text x="56" y="1025" fill="#405a70" font-family="Arial, sans-serif" font-size="16" font-weight="400">Stroomlijnen · Security architecture · November 2026</text></svg>