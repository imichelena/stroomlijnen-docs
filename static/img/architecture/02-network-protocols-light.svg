<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img"><title>Network overlay &amp; protocol boundaries</title><desc>Logical communication paths · Public-safe topology · Connection initiators shown by arrowheads</desc><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#00779b"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#00745f"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#8b5300"/></marker></defs><rect width="1400" height="1060" fill="#f7fafc"/><text x="56" y="48" fill="#00779b" font-family="Arial, sans-serif" font-size="16" font-weight="700">STROOMLIJNEN  /  SECURE ENERGY INFRASTRUCTURE</text><text x="56" y="104" fill="#0c2340" font-family="Arial, sans-serif" font-size="40" font-weight="700">Network overlay &amp; protocol boundaries</text><text x="56" y="145" fill="#405a70" font-family="Arial, sans-serif" font-size="20" font-weight="400">Logical communication paths · Public-safe topology · Connection initiators shown by arrowheads</text><rect x="56" y="206" width="1289" height="250" rx="22" fill="none" stroke="#00745f" stroke-width="2" stroke-dasharray="9 7"/><text x="80" y="240" fill="#00745f" font-family="Arial, sans-serif" font-size="17" font-weight="700">WIREGUARD OVERLAY  /  CLOUD ↔ SITE TRANSPORT</text><rect x="85" y="267" width="375" height="145" rx="18" fill="#ffffff" stroke="#00745f" stroke-width="1.5"/><text x="109" y="307" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Cloud platform API</text><text x="109" y="345" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Bastion-originated API traffic</text><text x="109" y="374" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">No cloud OCPP termination</text><rect x="910" y="267" width="405" height="145" rx="18" fill="#ffffff" stroke="#00745f" stroke-width="1.5"/><text x="934" y="307" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Site bastion</text><text x="934" y="345" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Overlay endpoint + API mediation</text><text x="934" y="374" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Local device protocol termination</text><path d="M903,337 L470,337" fill="none" stroke="#00745f" stroke-width="3" marker-end="url(#green)"/><text x="518" y="313" fill="#00745f" font-family="Arial, sans-serif" font-size="20" font-weight="700">API traffic over the overlay</text><text x="516" y="377" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Bastion initiates the connection</text><text x="56" y="503" fill="#00779b" font-family="Arial, sans-serif" font-size="17" font-weight="700">SITE INSIDE LAN  /  SEPARATE PROTOCOL PATHS</text><rect x="56" y="540" width="420" height="170" rx="18" fill="#ffffff" stroke="#00779b" stroke-width="1.5"/><text x="80" y="580" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Custom DC charger / APK</text><text x="80" y="618" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Auth + session lifecycle</text><text x="80" y="647" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Direct API client → bastion</text><text x="80" y="676" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">HTTPS with client certificate</text><rect x="56" y="751" width="420" height="160" rx="18" fill="#ffffff" stroke="#8b5300" stroke-width="1.5"/><text x="80" y="791" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">OEM AC charger</text><text x="80" y="829" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">OCPP client → local bastion</text><text x="80" y="858" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Fleet-dependent WS / WSS</text><text x="80" y="887" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">No blanket mTLS requirement</text><rect x="922" y="540" width="423" height="170" rx="18" fill="#ffffff" stroke="#00779b" stroke-width="1.5"/><text x="946" y="580" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Bastion direct API</text><text x="946" y="618" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Accepts the APK connection</text><text x="946" y="647" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">mTLS required for own APK</text><text x="946" y="676" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Scoped to this endpoint</text><rect x="922" y="751" width="423" height="160" rx="18" fill="#ffffff" stroke="#8b5300" stroke-width="1.5"/><text x="946" y="791" fill="#0c2340" font-family="Arial, sans-serif" font-size="25" font-weight="700">Bastion OCPP terminator</text><text x="946" y="829" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Terminates the local AC link</text><text x="946" y="858" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Translates to platform API</text><text x="946" y="887" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Does not relay OCPP to cloud</text><path d="M483,624 L914,624" fill="none" stroke="#00779b" stroke-width="3" marker-end="url(#blue)"/><text x="530" y="596" fill="#00779b" font-family="Arial, sans-serif" font-size="21" font-weight="700">HTTPS + mutual TLS</text><path d="M483,832 L914,832" fill="none" stroke="#8b5300" stroke-width="3" marker-end="url(#amber)"/><text x="542" y="803" fill="#8b5300" font-family="Arial, sans-serif" font-size="21" font-weight="700">Local OCPP 1.6</text><text x="506" y="870" fill="#8b5300" font-family="Arial, sans-serif" font-size="18" font-weight="400">Legacy WS is not encrypted</text><text x="56" y="949" fill="#405a70" font-family="Arial, sans-serif" font-size="18" font-weight="400">Scope: auth/session uplink. Local Modbus telemetry and device-control paths require a separate diagram.</text><text x="56" y="992" fill="#8b5300" font-family="Arial, sans-serif" font-size="17" font-weight="700">DOCUMENTED ARCHITECTURE · Verify the configuration of each deployed site</text><text x="56" y="1025" fill="#405a70" font-family="Arial, sans-serif" font-size="16" font-weight="400">Stroomlijnen · Security architecture · November 2026</text></svg>